name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 7 * * *"        # nightly read-tier integration run
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (no credentials)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest tests/ -v -m "not integration and not write"

  supply-chain:
    name: Supply chain (locked install, audit, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.13"
      - name: Verify uv.lock is in sync with pyproject.toml
        # Fails if the lockfile has drifted from pyproject.toml.
        run: uv lock --check
      - name: Verify requirements.txt matches the lockfile
        # The shipped hashed requirements.txt is what customers using
        # --require-hashes verify against; it must not drift from uv.lock or
        # they would be checking against stale hashes. Regenerate and fail on
        # any difference.
        run: |
          uv export --format requirements-txt --no-emit-project --no-dev -o requirements.txt
          git diff --exit-code requirements.txt
      - name: Install from the locked, hash-pinned dependency set
        # uv verifies each package against the per-package hashes in uv.lock;
        # this is the hash-enforced, reproducible install path.
        run: uv sync --locked --all-extras
      - name: Audit dependencies for known vulnerabilities (report-only)
        # Report-only for now. Current advisories are all in the mcp SDK's HTTP
        # transport stack (starlette / uvicorn / python-multipart / pyjwt), which
        # is unused by this stdio-only server, so the vulnerable code paths are
        # not reachable. Remediation (dep overrides / mcp SDK bump) tracked
        # separately; flip this to a hard gate once the HTTP-stack deps are bumped.
        continue-on-error: true
        run: uv run --with pip-audit pip-audit
      - name: Generate CycloneDX SBOM
        run: uv run --with cyclonedx-bom cyclonedx-py environment -o sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  integration:
    name: Integration tests (read-tier, live RSC)
    # Only on the nightly schedule or a manual dispatch — never on PRs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: Write service-account credential
        env:
          RSC_SERVICE_ACCOUNT_JSON: ${{ secrets.RSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$RSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "No RSC_SERVICE_ACCOUNT_JSON secret configured — integration tests will self-skip."
            exit 0
          fi
          mkdir -p "$HOME/.config/rsc"
          printf '%s' "$RSC_SERVICE_ACCOUNT_JSON" > "$HOME/.config/rsc/ci-sa.json"
          chmod 600 "$HOME/.config/rsc/ci-sa.json"
      - name: Run read-tier integration tests
        run: |
          # Read tier only. Write tests stay gated behind RSC_ALLOW_WRITE_TESTS,
          # which is intentionally NOT set in CI.
          export RSC_SERVICE_ACCOUNT_FILE="$HOME/.config/rsc/ci-sa.json"
          pytest tests/ -v -m "integration and not write"
