name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 7 * * *"        # nightly read-tier integration run
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (no credentials)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.13"
      # pytest lives in the `test` dependency group, which pip's `.[extra]`
      # syntax cannot see. uv installs it from the locked, hashed uv.lock.
      - run: uv sync --locked --group test --python ${{ matrix.python-version }}
      - run: uv run --no-sync pytest tests/ -v -m "not integration and not write"

  supply-chain:
    name: Supply chain (locked install, audit, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.13"
      - name: Verify uv.lock is in sync with pyproject.toml
        # Fails if the lockfile has drifted from pyproject.toml.
        run: uv lock --check
      - name: Verify requirements.txt matches the lockfile
        # The shipped hashed requirements.txt is what customers using
        # --require-hashes verify against; it must not drift from uv.lock or
        # they would be checking against stale hashes. Regenerate and fail on
        # any difference.
        run: |
          uv export --format requirements-txt --no-emit-project --no-dev -o requirements.txt
          git diff --exit-code requirements.txt
      - name: Verify the MCP Registry ownership marker survives into package metadata
        # The registry proves this PyPI package belongs to our server name by
        # finding this string in the PUBLISHED package description, which comes
        # from README.md via `readme` in pyproject.toml. Two ways it can break
        # silently: someone tidies the HTML comment out of the README, or the
        # `readme` declaration is dropped and the description goes empty again.
        # Either is unrecoverable after an upload, since PyPI metadata is
        # immutable per version. Check the built artifact, not the source file.
        run: |
          uv build --wheel --out-dir /tmp/marker-check
          python3 - <<'EOF'
          import glob, sys, zipfile
          whl = sorted(glob.glob('/tmp/marker-check/*.whl'))[-1]
          z = zipfile.ZipFile(whl)
          meta = z.read([n for n in z.namelist() if n.endswith('METADATA')][0]).decode()
          body = meta.partition('\n\n')[2]
          marker = 'mcp-name: io.github.rubrikinc/rubrik-mcp'
          if marker not in body:
              sys.exit(
                  f"MCP Registry marker missing from package metadata.\n"
                  f"  expected: {marker}\n"
                  f"  description length: {len(body.strip())} chars\n"
                  f"Check that README.md still contains the marker comment and that "
                  f"pyproject.toml still sets readme = \"README.md\"."
              )
          print(f"marker present; description is {len(body.strip()):,} chars")
          EOF

      - name: Install from the locked, hash-pinned dependency set
        # uv verifies each package against the per-package hashes in uv.lock;
        # this is the hash-enforced, reproducible install path.
        run: uv sync --locked --all-extras
      - name: Audit dependencies for known vulnerabilities
        # Hard gate. mcp bumped to 1.29.0 and rsc-client to 1.7.20260817 cleared
        # all previously known HTTP-stack CVEs (starlette, pyjwt, python-multipart,
        # requests). Fail the build on any new advisories.
        continue-on-error: false
        run: uv run --with pip-audit pip-audit
      - name: Generate CycloneDX SBOM
        run: uv run --with cyclonedx-bom cyclonedx-py environment -o sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  integration:
    name: Integration tests (read-tier, live RSC)
    # Only on the nightly schedule or a manual dispatch — never on PRs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.13"
      - run: uv sync --locked --group test --python 3.12
      - name: Write service-account credential
        env:
          RSC_SERVICE_ACCOUNT_JSON: ${{ secrets.RSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$RSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "No RSC_SERVICE_ACCOUNT_JSON secret configured — integration tests will self-skip."
            exit 0
          fi
          mkdir -p "$HOME/.config/rsc"
          printf '%s' "$RSC_SERVICE_ACCOUNT_JSON" > "$HOME/.config/rsc/ci-sa.json"
          chmod 600 "$HOME/.config/rsc/ci-sa.json"
      - name: Run read-tier integration tests
        run: |
          # Read tier only. Write tests stay gated behind RSC_ALLOW_WRITE_TESTS,
          # which is intentionally NOT set in CI.
          export RSC_SERVICE_ACCOUNT_FILE="$HOME/.config/rsc/ci-sa.json"
          uv run --no-sync pytest tests/ -v -m "integration and not write"
