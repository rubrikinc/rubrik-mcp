[build-system]
# Pinned per policy: all direct dependencies carry an exact version,
# including the build backend.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "rubrik-mcp"
dynamic = ["version"]
description = "MCP server for Rubrik Security Cloud"
readme = "README.md"
license = "MIT"
# NOTICE carries the third-party license notices for bundled dependencies
# (mcp, rsc-client, and their transitive deps), so it ships alongside LICENSE
# in every artifact, not just the repo.
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
  { name = "Rubrik, Inc." },
]
keywords = ["rubrik", "rsc", "mcp", "model-context-protocol", "graphql", "security", "backup", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "mcp[cli]==1.29.0",
    "rsc-client==1.7.20260914",
]

# A dependency group, not an extra: groups are never written to the published
# package metadata, so this exact pin binds our CI without forcing a pytest
# version on anyone who installs rubrik-mcp.
[dependency-groups]
test = ["pytest==9.1.1"]

[tool.uv]
# Exact pins for transitive dependencies we need to control. These are
# constraints, not dependencies: nothing here is imported by rubrik-mcp, so
# declaring them under [project.dependencies] would misstate what this package
# actually uses. Pinned exactly rather than floored, per the supply-chain
# policy that every version be explicit and reviewed.
constraint-dependencies = [
    # CVE-2026-63374, CVE-2026-64847 (fixed in 4.14.2). Reaches us via httpx,
    # mcp, starlette, and sse-starlette; mcp itself only requires anyio>=4.5.
    "anyio==4.15.1",
    # CVE-2026-102274 (fixed in 2.14.0). Reaches us via mcp.
    "pyjwt==2.14.0",
]

[project.urls]
Homepage = "https://github.com/rubrikinc/rubrik-mcp"
Repository = "https://github.com/rubrikinc/rubrik-mcp"
Documentation = "https://developer.rubrik.com"
"Bug Tracker" = "https://github.com/rubrikinc/rubrik-mcp/issues"

[tool.hatch.version]
path = "src/rubrik/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rubrik"]

# Allowlist, not denylist: without this, hatch ships everything git tracks,
# including repo tooling (CLAUDE.md, CI workflows, Dockerfile, uv.lock). An
# allowlist also keeps new top-level files out by default. pyproject.toml and
# the license-files above are always included, as is .gitignore (hatch
# always ships it in sdists and ignores excludes for it).
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
]

[project.scripts]
rubrik-mcp = "rubrik.server:main"
rubrik-job-monitor = "rubrik.server:job_monitor_main"

[tool.pytest.ini_options]
markers = [
    "integration: live-RSC tests; require RSC_SERVICE_ACCOUNT_FILE (self-skip otherwise)",
    "write: mutating live-RSC tests; require a write SA + RSC_ALLOW_WRITE_TESTS=1 (self-skip otherwise)",
]
