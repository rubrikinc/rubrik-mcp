[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rubrik-mcp"
dynamic = ["version"]
description = "MCP server for Rubrik Security Cloud"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==1.29.0",
    "rsc-client==1.7.20260914",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.uv]
# Security floors for transitive dependencies. These are constraints, not
# dependencies: nothing here is imported by rubrik-mcp, so declaring them under
# [project.dependencies] would misstate what this package actually uses. They
# only stop the resolver from selecting a version with a known advisory.
constraint-dependencies = [
    # CVE-2026-63374, CVE-2026-64847. Reaches us via httpx, mcp, starlette,
    # and sse-starlette; mcp itself only requires anyio>=4.5.
    "anyio>=4.14.2",
]

[tool.hatch.version]
path = "src/rubrik/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rubrik"]

[project.scripts]
rubrik-mcp = "rubrik.server:main"
rubrik-job-monitor = "rubrik.server:job_monitor_main"

[tool.pytest.ini_options]
markers = [
    "integration: live-RSC tests; require RSC_SERVICE_ACCOUNT_FILE (self-skip otherwise)",
    "write: mutating live-RSC tests; require a write SA + RSC_ALLOW_WRITE_TESTS=1 (self-skip otherwise)",
]
